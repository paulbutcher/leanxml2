name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev pkg-config
      - uses: leanprover/lean-action@v1
